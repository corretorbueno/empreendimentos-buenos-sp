<section id="empreendimentos-econ">
  <h2>Conheça nossos empreendimentos</h2>
  <p class="subtitulo-econ">
    Encontre seu apartamento e fale comigo para receber mais informações.
  </p>

  <div class="econ-grade" id="econ-grade"></div>
</section>

<style>
  #empreendimentos-econ {
    width: 100%;
    max-width: 1200px;
    margin: 35px auto;
    padding: 20px;
    font-family: Arial, sans-serif;
  }

  #empreendimentos-econ h2 {
    text-align: center;
    color: #173653;
    font-size: 30px;
    margin-bottom: 10px;
  }

  .subtitulo-econ {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
    line-height: 1.6;
  }

  .econ-grade {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 22px;
  }

  .econ-card {
    background: #fff;
    border: 1px solid #e1e5e9;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 14px #0000000d;
    display: flex;
    flex-direction: column;
  }

  .econ-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
    background: #e9edf0;
  }

  .econ-card-conteudo {
    padding: 18px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .econ-card h3 {
    color: #173653;
    margin: 0 0 10px;
    font-size: 20px;
  }

  .econ-card p {
    color: #626b74;
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 16px;
  }

  .econ-botoes {
    display: grid;
    gap: 10px;
    margin-top: auto;
  }

  .econ-botao {
    display: block;
    padding: 12px;
    text-align: center;
    text-decoration: none;
    font-weight: bold;
    border-radius: 7px;
    font-size: 14px;
  }

  .econ-botao-ver {
    color: white;
    background: #173653;
  }

  .econ-botao-whats {
    color: white;
    background: #168b50;
  }

  .econ-botao:hover {
    opacity: .88;
  }

  @media (max-width: 850px) {
    .econ-grade {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 560px) {
    .econ-grade {
      grid-template-columns: 1fr;
    }

    #empreendimentos-econ h2 {
      font-size: 25px;
    }
  }
</style>
