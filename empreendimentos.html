<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#103c2c">
  <meta name="description" content="Conheça os empreendimentos Econ em São Paulo e região. Consulte opções e fale com a Empreendimentos Buenos SP pelo WhatsApp.">
  <title>Empreendimentos | Buenos SP</title>
  <style>
    :root {
      --green: #103c2c;
      --green-dark: #09291f;
      --lime: #c7f36b;
      --lime-dark: #a8df48;
      --white: #fff;
      --background: #f7f9f6;
      --text: #17251d;
      --muted: #657168;
      --border: #e1e8df;
      --radius: 18px;
      --shadow: 0 16px 45px rgba(16, 60, 44, .09);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 95px; }
    body {
      margin: 0;
      font-family: "DM Sans", Arial, sans-serif;
      color: var(--text);
      background: var(--background);
      line-height: 1.65;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--lime-dark);
      outline-offset: 3px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 82px;
      padding: 14px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      background: rgba(255,255,255,.97);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1.5;
    }
    .logo-icon {
      display: grid;
      place-items: center;
      width: 43px;
      height: 43px;
      flex-shrink: 0;
      border-radius: 12px;
      background: var(--green);
      color: var(--lime);
      font-size: 27px;
      font-weight: 800;
    }
    .logo strong {
      display: block;
      font-size: 17px;
      letter-spacing: .5px;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 26px;
      font-size: 13px;
      font-weight: 600;
    }
    .nav a:not(.button):hover { color: #477b35; }
    .menu-toggle {
      display: none;
      border: 0;
      background: transparent;
      color: var(--green);
      font-size: 27px;
      cursor: pointer;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 13px 20px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: var(--lime);
      color: var(--green-dark);
      font-size: 13px;
      font-weight: 800;
      transition: transform .2s, background .2s;
      cursor: pointer;
    }
    .button:hover { background: var(--lime-dark); transform: translateY(-1px); }
    .button-small { min-height: 40px; padding: 10px 15px; }
    .button-outline {
      background: transparent;
      color: white;
      border-color: rgba(255,255,255,.45);
    }
    .button-outline:hover { background: rgba(255,255,255,.1); color: white; }

    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(120deg, var(--green-dark), var(--green));
      color: white;
      padding: 66px 6% 60px;
    }
    .hero::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      right: -130px;
      top: -190px;
      border: 1px solid rgba(199,243,107,.18);
      border-radius: 50%;
      box-shadow: 0 0 0 55px rgba(199,243,107,.035), 0 0 0 110px rgba(199,243,107,.025);
      pointer-events: none;
    }
    .hero-inner {
      position: relative;
      z-index: 1;
      width: min(1120px, 100%);
      margin: auto;
    }
    .eyebrow {
      display: inline-block;
      margin-bottom: 12px;
      color: var(--lime);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .hero h1 {
      max-width: 780px;
      margin: 0 0 18px;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.08;
      letter-spacing: -1.7px;
    }
    .hero h1 span { color: var(--lime); }
    .hero p {
      max-width: 650px;
      margin: 0 0 26px;
      color: #e0e9e2;
      font-size: 16px;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .hero-note {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 24px;
      color: #e0e9e2;
      font-size: 12px;
    }
    .hero-note span::before { content: "✓"; margin-right: 7px; color: var(--lime); font-weight: 900; }

    main { width: min(1120px, 100%); margin: auto; padding: 52px 24px 70px; }
    .section-heading { margin-bottom: 25px; }
    .section-heading .eyebrow { color: #477b35; margin-bottom: 7px; }
    .section-heading h2 { margin: 0 0 8px; color: var(--green); font-size: clamp(26px, 3vw, 36px); line-height: 1.2; }
    .section-heading p { margin: 0; color: var(--muted); }
    .filters {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(220px, 1fr);
      gap: 12px;
      margin: 25px 0 18px;
    }
    .filters input, .filters select {
      width: 100%;
      min-width: 0;
      min-height: 50px;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      color: var(--text);
    }
    .filters input:focus, .filters select:focus { border-color: #7da34a; }
    .counter { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }
    .card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: white;
      box-shadow: var(--shadow);
      transition: transform .2s, box-shadow .2s;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 20px 48px rgba(16,60,44,.15); }
    .photo {
      position: relative;
      height: 225px;
      overflow: hidden;
      background: linear-gradient(135deg, #e7eee4, #d4e2d0);
    }
    .photo img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .35s; }
    .card:hover .photo img { transform: scale(1.035); }
    .photo-fallback[hidden] { display: none !important; }
    .photo-fallback {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      padding: 20px;
      text-align: center;
      color: var(--green);
    }
    .photo-fallback .building { font-size: 43px; line-height: 1; }
    .photo-fallback small { color: var(--muted); }
    .status {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
      max-width: calc(100% - 24px);
      padding: 6px 10px;
      border-radius: 7px;
      background: var(--lime);
      color: var(--green-dark);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      box-shadow: 0 3px 10px #0001;
    }
    .card-content { display: flex; flex: 1; flex-direction: column; padding: 19px; }
    .card h3 { margin: 0 0 8px; color: var(--green); font-size: 21px; line-height: 1.25; }
    .location { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
    .details { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; }
    .detail { padding: 6px 9px; border-radius: 7px; background: #f0f5ec; color: #38533c; font-size: 11px; }
    .card-actions { display: grid; gap: 9px; margin-top: auto; }
    .whatsapp-button { width: 100%; }
    .official-link { padding: 5px; text-align: center; color: #477b35; font-size: 12px; font-weight: 700; }
    .official-link:hover { text-decoration: underline; }
    .empty, .loading, .error {
      grid-column: 1 / -1;
      padding: 30px 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      color: var(--muted);
      text-align: center;
    }
    .catalog {
      margin-top: 44px;
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: white;
      text-align: center;
    }
    .catalog h2 { margin: 0 0 8px; color: var(--green); }
    .catalog p { max-width: 680px; margin: 0 auto 20px; color: var(--muted); }
    .footer { padding: 30px 20px; background: var(--green-dark); color: white; text-align: center; }
    .footer .footer-brand { margin-bottom: 8px; font-weight: 800; letter-spacing: 1px; }
    .footer .footer-brand span { color: var(--lime); }
    .footer p { margin: 5px; color: #d5e2d7; font-size: 12px; }
    .footer a { color: var(--lime); }
    .floating-whatsapp {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 15;
      padding: 13px 18px;
      border-radius: 50px;
      background: var(--lime);
      color: var(--green-dark);
      font-size: 13px;
      font-weight: 900;
      box-shadow: 0 6px 22px #0003;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .nav { gap: 16px; }
    }
    @media (max-width: 650px) {
      .header { min-height: 72px; padding: 12px 5%; }
      .menu-toggle { display: block; }
      .nav {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        padding: 18px 5% 22px;
        align-items: stretch;
        flex-direction: column;
        gap: 16px;
        background: white;
        border-bottom: 1px solid var(--border);
      }
      .nav.open { display: flex; }
      .nav .button { width: fit-content; }
      .hero { padding: 48px 6% 43px; }
      .hero h1 { letter-spacing: -1px; }
      main { padding: 38px 16px 55px; }
      .filters { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
      .catalog { padding: 25px 18px; }
    }
  </style>
