
name: Atualizar catálogo Econ

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1"

permissions:
  contents: write

concurrency:
  group: atualizar-catalogo
  cancel-in-progress: false

jobs:
  atualizar-catalogo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Conferir arquivos
        run: |
          test -f atualizar_catalogo.py
          test -f empreendimentos.html

      - name: Extrair imagens oficiais
        run: python -u atualizar_catalogo.py

      - name: Salvar HTML atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add empreendimentos.html

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no catálogo."
          else
            git commit -m "Atualiza imagens do catálogo Econ"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
