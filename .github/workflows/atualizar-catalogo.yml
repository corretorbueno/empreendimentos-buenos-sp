name: Atualizar catálogo completo da Econ

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizacao-catalogo-econ
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar otimizador de imagens
        run: python -m pip install Pillow
      - name: Importar catálogo completo e capas
        run: python -u scripts/atualizar_catalogo.py
      - name: Salvar atualização
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogo-dados.js relatorio-importacao.json images/econ
          if ! git diff --cached --quiet; then
            git commit -m 'Atualiza catálogo completo da Econ e capas locais'
            git push
          fi
