
name: Atualizar catalogo de empreendimentos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-catalogo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Atualizar catalogo no HTML
        run: python scripts/atualizar_catalogo.py

      - name: Conferir alteracoes
        run: |
          git status --short
          git diff --stat
          git diff --check

      - name: Salvar HTML atualizado no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add empreendimentos.html

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao no catalogo."
          else
            git commit -m "Atualiza catalogo de empreendimentos"
            git push
          fi
