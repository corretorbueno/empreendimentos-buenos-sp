
name: Atualizar imagens dos empreendimentos Econ

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-imagens-econ
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Atualizar imagens no HTML
        run: python -u atualizar_catalogo.py

      - name: Salvar HTML atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add empreendimentos.html

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no catálogo."
            exit 0
          fi

          git commit -m "Atualiza imagens dos empreendimentos Econ"
          git push origin HEAD:main

            echo "Nenhuma alteracao no catalogo."
          else
            git commit -m "Atualiza catalogo de empreendimentos"
            git push
          fi
